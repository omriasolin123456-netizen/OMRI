[hotkey]
; Горячая клавиша AutoHotkey (например F8, ^F8, !F9)
key = F8

[microinvest]
; Заголовок окна (частичное совпадение)
window_title = Microinvest

; ClassNN полей карточки товара (Microinvest Склад Pro 3.07.075 / Windows 11 x64)
; При смене сессии Windows Forms суффикс _r8_ может меняться — правьте здесь.
field_name = WindowsForms10.EDIT.app.0.19bf6b8_r8_ad110
field_barcode = WindowsForms10.EDIT.app.0.19bf6b8_r8_ad19
field_ntin = WindowsForms10.EDIT.app.0.19bf6b8_r8_ad11

; Если ClassNN не найден, искать поле по порядковому номеру Edit-контрола (0 = отключено)
fallback_name_index = 0
fallback_barcode_index = 0
fallback_ntin_index = 0

[paths]
; Папка с прайс-листами .xlsx (относительно корня программы или абсолютный путь)
price_dir = price
; Папка логов
log_dir = logs
; Временный файл результата для AHK
result_file = logs/last_result.json

[python]
; Путь к python.exe на Windows. Оставьте python, если он в PATH.
executable = python
; Таймаут ожидания ответа Python (мс) для AHK
timeout_ms = 120000

[search]
; API-ключ FAPI (база кроссов автозапчастей). Демо-ключ можно заменить своим.
fapi_key = d858b0c4-ed5e-4e88-a792-3ab33c3d57cd
fapi_base = https://fapi.iisis.ru/fapi/v2
; Дополнительный поиск через веб (DuckDuckGo)
enable_web_enrichment = true
; Максимум вариантов в окне выбора
max_candidates = 12
; HTTP-таймаут секунд
http_timeout = 25

[ntin]
; Поиск NTIN в Национальном каталоге товаров Казахстана
enabled = true
; Опциональный токен API НКТ (nationalcatalog.kz / nct.kz). Без токена — публичный веб-поиск.
api_token =
api_base = https://nct.kz
; Также искать через DuckDuckGo по сайтам НКТ
web_search = true

[excel]
; Имена колонок (через | — альтернативы). Регистр не важен.
; Формат 1: Производитель + Товар
; Формат 2: Наименование товара + Мадель + Бренд
; Формат 3: Номенклатура вида «Название //OE...// БРЕНД»
col_name = Наименование товара|Наименование|Товар|Номенклатура|Ценовая группа|Характеристика номенклатуры|Ценовая группа/ Номенклатура/ Характеристика номенклатуры|Name
col_brand = Бренд|Производитель|Фирма|Brand|Manufacturer
col_model = Мадель|Модель|МОДЕЛЬ АВТОМОБИЛЯ|Модель автомобиля|Автомобиль|Model|Car Model
; Не использовать артикул/каталожный номер/Номер для сопоставления с полем «Имя»
ignore_article_columns = true
; Минимальный score совпадения (0..1)
min_match_score = 0.45

[ui]
; always = всегда показывать окно, если >1 варианта
; auto_single = один вариант выбирается без окна
selection_mode = auto_single
