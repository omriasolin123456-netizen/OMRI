[hotkey]
key = F8

[microinvest]
window_title = Microinvest
field_name = WindowsForms10.EDIT.app.0.19bf6b8_r8_ad110
field_barcode = WindowsForms10.EDIT.app.0.19bf6b8_r8_ad19
field_ntin = WindowsForms10.EDIT.app.0.19bf6b8_r8_ad11
fallback_name_index = 0
fallback_barcode_index = 0
fallback_ntin_index = 0

[paths]
price_dir = price
log_dir = logs
result_file = logs/last_result.json

[python]
executable = python
timeout_ms = 60000

[search]
fapi_key = d858b0c4-ed5e-4e88-a792-3ab33c3d57cd
fapi_base = https://fapi.iisis.ru/fapi/v2
; F8: сначала Excel, если пусто — быстрый FAPI. DDG выкл.
enable_web_enrichment = false
max_candidates = 10
; Короткий HTTP-таймаут для супербыстрого интернета
http_timeout = 4

[omega]
; Не используется в новом пайплайне (Excel → интернет). Опционально.
enabled = false
login =
api_key =
api_base = https://omega-auto-parts.kz/api/v1
timeout = 5
enrich_articles = false
enrich_limit = 3
test_number = 120281

[ntin]
enabled = true
; Публичный поиск NTIN (как на сайте nationalcatalog.kz) — без токена
gw_search = https://nationalcatalog.kz/gw/search/api/v1/search
page_size = 20
; Опциональный Bearer-токен (Личный кабинет → Ключи API)
api_token =
api_base = https://nct.kz
; Медленный DDG-fallback — не нужен, gateway работает без токена
web_search = false
ntin_timeout = 6

[excel]
col_name = Наименование товара|Наименование|Товар|Номенклатура|Ценовая группа|Характеристика номенклатуры|Ценовая группа/ Номенклатура/ Характеристика номенклатуры|Name
col_brand = Торговая марка|Бренд|Производитель|Фирма|Brand|Manufacturer
col_model = Мадель|Модель|МОДЕЛЬ АВТОМОБИЛЯ|Модель автомобиля|Автомобиль|Model|Car Model|Марка
ignore_article_columns = true
; Штрихкод из «Имя» ищется по всей строке Excel (все колонки).
excel_search_article_columns = true
min_match_score = 0.55
excel_override_score = 0.8

[ui]
selection_mode = always
