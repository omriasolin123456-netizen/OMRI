[hotkey]
key = F8

[microinvest]
window_title = Microinvest
field_name = WindowsForms10.EDIT.app.0.19bf6b8_r8_ad110
field_barcode = WindowsForms10.EDIT.app.0.19bf6b8_r8_ad19
field_ntin = WindowsForms10.EDIT.app.0.19bf6b8_r8_ad11
fallback_name_index = 0
fallback_barcode_index = 0
fallback_ntin_index = 0

[paths]
price_dir = price
log_dir = logs
result_file = logs/last_result.json

[python]
executable = python
timeout_ms = 60000

[search]
fapi_key = d858b0c4-ed5e-4e88-a792-3ab33c3d57cd
fapi_base = https://fapi.iisis.ru/fapi/v2
; Веб-поиск медленный — по умолчанию ВЫКЛ (достаточно FAPI)
enable_web_enrichment = false
max_candidates = 10
; Короткий HTTP-таймаут для скорости
http_timeout = 8

[omega]
; Быстрый поиск штрихкода/артикула на omega-auto-parts.kz (REST API ~0.6с)
enabled = true
; Логин оптового кабинета (email или телефон)
login =
; API-ключ со страницы https://omega-auto-parts.kz/shop/api
api_key =
api_base = https://omega-auto-parts.kz/api/v1
timeout = 5
; false = только /search/brands (быстрее); true = ещё /search/articles
enrich_articles = false
enrich_limit = 3
test_number = 120281

[ntin]
enabled = true
; Токен API НКТ (nationalcatalog.kz → Личный кабинет → Ключи API)
; С токеном поиск NTIN быстрее и точнее. Без токена — короткий веб-поиск.
api_token =
api_base = https://nct.kz
web_search = true
ntin_timeout = 6

[excel]
col_name = Наименование товара|Наименование|Товар|Номенклатура|Ценовая группа|Характеристика номенклатуры|Ценовая группа/ Номенклатура/ Характеристика номенклатуры|Name
col_brand = Бренд|Производитель|Фирма|Brand|Manufacturer
col_model = Мадель|Модель|МОДЕЛЬ АВТОМОБИЛЯ|Модель автомобиля|Автомобиль|Model|Car Model
ignore_article_columns = true
; Искать код также в колонках Номер/Каталожный № (обычно false по вашей схеме)
excel_search_article_columns = false
min_match_score = 0.55
excel_override_score = 0.8

[ui]
selection_mode = always
