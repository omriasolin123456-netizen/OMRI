name: Marketplace Poster Final Release

on:
  push:
    branches: [marketplace-poster-updates]
    paths:
      - 'marketplace-poster/app/**'
      - '.github/workflows/marketplace-poster-final.yml'
      - 'marketplace-poster/FINAL_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketplace-poster-final-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: marketplace-poster-updates

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Verify, format and test source
        shell: pwsh
        working-directory: marketplace-poster/app
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '2.5.1') { throw "Expected version 2.5.1, found $version" }
          $goFiles = @((Get-ChildItem -File *.go).FullName) + @((Get-ChildItem -File automation/*.go).FullName)
          gofmt -w $goFiles
          if ($LASTEXITCODE -ne 0) { throw 'gofmt failed' }
          go mod tidy
          if ($LASTEXITCODE -ne 0) { throw 'go mod tidy failed' }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'go test failed' }
          node --check web/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax check failed' }

      - name: Embed Windows icon and manifest
        shell: pwsh
        working-directory: marketplace-poster/app
        run: |
          go install github.com/akavel/rsrc@latest
          if ($LASTEXITCODE -ne 0) { throw 'rsrc installation failed' }
          $rsrc = Join-Path (go env GOPATH) 'bin/rsrc.exe'
          & $rsrc -ico 'installer/MarketplacePoster.ico' -manifest 'installer/app.manifest' -o marketplaceposter.syso
          if ($LASTEXITCODE -ne 0) { throw 'resource embedding failed' }

      - name: Build Windows application
        shell: pwsh
        working-directory: marketplace-poster/app
        run: |
          New-Item -ItemType Directory -Force ../../release,dist | Out-Null
          go build -trimpath -ldflags '-H=windowsgui -s -w' -o ../../release/MarketplacePoster.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Windows application build failed' }
          Copy-Item ../../release/MarketplacePoster.exe dist/MarketplacePoster.exe -Force

      - name: Build Setup Wizard
        shell: pwsh
        working-directory: marketplace-poster/app
        run: |
          choco install innosetup -y --no-progress
          $version = (Get-Content VERSION -Raw).Trim()
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc "/DMyAppVersion=$version" 'installer\MarketplacePoster.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup build failed' }
          if (-not (Test-Path 'dist\MarketplacePoster-Setup.exe')) { throw 'Setup EXE was not created' }
          Copy-Item dist/MarketplacePoster-Setup.exe ../../release/MarketplacePoster-Setup.exe -Force

      - name: Package source
        shell: pwsh
        run: |
          $source = 'marketplace-poster/app'
          $zip = 'release/MarketplacePoster-source-v2.5.1.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          $items = Get-ChildItem $source -Force | Where-Object { $_.Name -notin @('dist', 'marketplaceposter.syso') }
          Compress-Archive -Path $items.FullName -DestinationPath $zip -CompressionLevel Optimal

      - name: Create hashes and update manifest
        shell: pwsh
        run: |
          $app = (Get-FileHash release/MarketplacePoster.exe -Algorithm SHA256).Hash.ToLower()
          $setup = (Get-FileHash release/MarketplacePoster-Setup.exe -Algorithm SHA256).Hash.ToLower()
          $source = (Get-FileHash release/MarketplacePoster-source-v2.5.1.zip -Algorithm SHA256).Hash.ToLower()
          $notes = (Get-Content marketplace-poster/app/RELEASE_NOTES.txt -Raw).Trim()
          $manifest = [ordered]@{
            version = '2.5.1'
            download_url = 'https://raw.githubusercontent.com/omriasolin123456-netizen/OMRI/marketplace-poster-updates/release/MarketplacePoster.exe'
            sha256 = $app
            setup_url = 'https://raw.githubusercontent.com/omriasolin123456-netizen/OMRI/marketplace-poster-updates/release/MarketplacePoster-Setup.exe'
            setup_sha256 = $setup
            source_url = 'https://raw.githubusercontent.com/omriasolin123456-netizen/OMRI/marketplace-poster-updates/release/MarketplacePoster-source-v2.5.1.zip'
            source_sha256 = $source
            notes = $notes
          } | ConvertTo-Json
          [IO.File]::WriteAllText((Join-Path $PWD 'release/manifest.json'), $manifest, (New-Object Text.UTF8Encoding($false)))
          Set-Content release/MarketplacePoster.exe.sha256 "$app  MarketplacePoster.exe" -Encoding ascii
          Set-Content release/MarketplacePoster-Setup.exe.sha256 "$setup  MarketplacePoster-Setup.exe" -Encoding ascii
          Set-Content release/MarketplacePoster-source-v2.5.1.zip.sha256 "$source  MarketplacePoster-source-v2.5.1.zip" -Encoding ascii

      - name: Publish release files
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marketplace-poster/app release
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Build Marketplace Poster 2.5.1 Final [skip ci]'
            git push origin HEAD:marketplace-poster-updates
          }

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketplacePoster-2.5.1
          path: |
            release/MarketplacePoster.exe
            release/MarketplacePoster.exe.sha256
            release/MarketplacePoster-Setup.exe
            release/MarketplacePoster-Setup.exe.sha256
            release/MarketplacePoster-source-v2.5.1.zip
            release/MarketplacePoster-source-v2.5.1.zip.sha256
            release/manifest.json
          if-no-files-found: error
